name: Keep Supabase / Render alive

# Pings the deployed backend's DB-backed health endpoint every 3 days so the
# Supabase free-tier project (and the Render free-tier web service) don't get
# paused for inactivity. Requires a repository variable or secret named
# BACKEND_HEALTH_URL, e.g. https://your-app.onrender.com/actuator/health
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::BACKEND_HEALTH_URL is not set. Add it as a repo variable or secret (Settings > Secrets and variables > Actions) pointing at your deployed /actuator/health endpoint."
            exit 1
          fi
          echo "Pinging $HEALTH_URL"
          curl -sf "$HEALTH_URL"
