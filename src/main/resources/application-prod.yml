spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's free-tier pooler (session mode) caps total clients at 15,
      # shared across every connection to the project - prod, local dev,
      # the Supabase dashboard, etc. Keep this small so one Render instance
      # can't exhaust it on its own (this happened once already).
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 5000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  # Catalyst AppSail tells the app which port to listen on; other hosts usually use PORT.
  port: ${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:8080}}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

app:
  # Render (and most PaaS) terminate TLS at one proxy that appends the client address.
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  # Render injects RENDER_EXTERNAL_URL; on Catalyst (or with a custom domain) set PUBLIC_BASE_URL explicitly.
  public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
