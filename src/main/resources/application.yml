spring:
  application:
    name: linky
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:onboarding@resend.dev}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:true}

resend:
  api-key: ${RESEND_API_KEY:}

server:
  shutdown: graceful
  # Never leak stack traces, exception types or internal messages to clients;
  # the GlobalExceptionHandler is responsible for every client-facing message.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
