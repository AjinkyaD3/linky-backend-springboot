spring:
  datasource:
    url: jdbc:h2:mem:linkytestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: this-is-a-default-secret-key-for-jwt-signing-which-must-be-very-long-and-secure-for-tests
  access-token-expiry: 900000
  refresh-token-expiry: 604800000
